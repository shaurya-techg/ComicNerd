# IMPORTANT:
# This is an example/template file.
# Do NOT commit real secret values to GitHub.
#
# To create the actual secrets, copy this file to secrets.yaml,
# replace the placeholder values, and apply it manually.

---
apiVersion: v1
kind: Secret

metadata:
  name: postgres-secrets
  namespace: comicnerd

type: Opaque

stringData:
  POSTGRES_DB: "YOUR_POSTGRES_DATABASE"
  POSTGRES_USER: "YOUR_POSTGRES_USERNAME"
  POSTGRES_PASSWORD: "YOUR_POSTGRES_PASSWORD"

---
apiVersion: v1
kind: Secret

metadata:
  name: comicnerd-secrets
  namespace: comicnerd

type: Opaque

stringData:
  COMICVINE_API_KEY: "YOUR_COMICVINE_API_KEY"
  GROQ_API_KEY: "YOUR_GROQ_API_KEY"
  MONGODB_DB: "YOUR_MONGODB_DATABASE_NAME"
  MONGODB_URI: "YOUR_MONGODB_CONNECTION_URI"
  SECRET_KEY: "YOUR_DJANGO_SECRET_KEY"