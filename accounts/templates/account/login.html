{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[70vh]">

    <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-lg border border-gray-800">

        <!-- Deadpool Image + Speech Bubble -->

        <div class="flex flex-col items-center mb-6">
            {% load static %}
            <img
                src="{% static 'images/deadpool-coffee-removebg.png' %}"
                alt="Deadpool drinking coffee"
                class="w-32 h-32 object-contain"
            >

            <div
                class="relative mt-2 bg-yellow-100 text-black px-4 py-2 rounded-xl font-semibold shadow-md"
            >
                Nice to see you again champ!

                <!-- Speech Bubble Tail -->
                <div
                    class="absolute -top-2 left-1/2 -translate-x-1/2 w-4 h-4 bg-yellow-100 rotate-45"
                ></div>
            </div>

        </div>

        <!-- Heading -->

    

        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="block mb-2 text-gray-300">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-yellow-400"
                    required
                >

            </div>

            <div class="mb-6">

                <label class="block mb-2 text-gray-300">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-yellow-400"
                    required
                >

            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200"
            >
                Login
            </button>

        </form>

        <!-- Register Link -->

        <p class="mt-6 text-center text-gray-400">

            New User?

            <a
                href="{% url 'register' %}"
                class="text-yellow-300 hover:text-yellow-200 hover:underline"
            >
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
