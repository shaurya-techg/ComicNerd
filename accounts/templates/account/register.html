{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[70vh]">

    <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl shadow-lg">

        <h2 class="text-3xl font-bold text-center text-yellow-300 mb-6">
            Create Account
        </h2>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="block mb-2 text-gray-300">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:border-yellow-400"
                    required
                >

            </div>

            <div class="mb-6">

                <label class="block mb-2 text-gray-300">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:border-yellow-400"
                    required
                >

            </div>

            <button
                type="submit"
                class="w-full bg-yellow-500 text-black py-3 rounded-lg hover:bg-yellow-400"
            >
                Register
            </button>

        </form>

        <p class="mt-6 text-center text-gray-400">

            Already have an account?

            <a
                href="{% url 'login' %}"
                class="text-yellow-300 hover:underline"
            >
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
