{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[70vh] px-4">

    <div class="w-full max-w-md bg-gray-900 p-6 sm:p-8 rounded-2xl shadow-lg">

        <h2 class="text-3xl font-bold text-center text-yellow-300 mb-6">
            Create Account
        </h2>

        <!-- Django Messages -->
        {% if messages %}
            {% for message in messages %}

                <div class="mb-4 p-3 rounded-lg
                    {% if message.tags == 'error' %}
                        bg-red-900/50 border border-red-500 text-red-200
                    {% elif message.tags == 'success' %}
                        bg-green-900/50 border border-green-500 text-green-200
                    {% else %}
                        bg-gray-800 border border-gray-700 text-gray-200
                    {% endif %}
                ">
                    {{ message }}
                </div>

            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">

                <label class="block mb-2 text-gray-300">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:border-yellow-400"
                    required
                >

            </div>

            <div class="mb-6">

                <label class="block mb-2 text-gray-300">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none focus:border-yellow-400"
                    required
                >

            </div>

            <button
                type="submit"
                class="w-full bg-yellow-500 text-black py-3 rounded-lg hover:bg-yellow-400 transition"
            >
                Register
            </button>

        </form>

        <p class="mt-6 text-center text-gray-400">

            Already have an account?

            <a
                href="{% url 'login' %}"
                class="text-yellow-300 hover:underline"
            >
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
